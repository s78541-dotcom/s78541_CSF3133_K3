<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Exercise 4 - Web Design</title>
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Internal CSS -->
    <style>
        header h1 {
            text-decoration: underline;
        }
        .internal-styled-text {
            text-decoration: overline;
        }
    </style>
</head>
<body>

    <!-- Semantic Header -->
    <header>
        <h1>Web Development Lab 4</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#media">Media</a></li>
                <li><a href="#interactive">Form</a></li>
            </ul>
        </nav>
    </header>

    <main>
    <!-- Semantic Section: About -->
    <section id="about">
        <h2>About This Project</h2>
        <article>
            <h3>Project Overview</h3>
            <p class="internal-styled-text">This webpage demonstrates semantic HTML5 elements, media embedding, CSS styling, and interactive form controls.</p>
        </article>
    </section>

        <!-- Semantic Section: Media -->
        <section id="media">
            <h2>Featured Video</h2>
            <figure>
                <video controls width="640" height="360">
                    <source src="sample-video.mp4" type="video/mp4">
                    <track kind="captions" src="captions.vtt" srclang="en" label="English Captions" default>
                    Your browser does not support the video tag.
                </video>
                <figcaption>Figure 1: Demonstration video.</figcaption>
            </figure>
        </section>

        <!-- Semantic Section: Interactive Form -->
        <section id="interactive">
            <h2>Interactive Form</h2>
            <form action="#" method="post" class="styled-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Favorite Hobbies:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="hobbies" value="coding"> Coding</label>
                        <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
                        <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
                        <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </main>

    <!-- Semantic Footer -->
    <footer>
        <p>&copy; 2026 Web-Based Interface Design. All Rights Reserved.</p>
    </footer>

</body>
</html>
